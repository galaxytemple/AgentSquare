version: 2

project_name: agentsquare

before:
  hooks:
    - go mod tidy
    - GOOS=js GOARCH=wasm go build -o web/viewer/agentsquare.wasm ./cmd/agentsquare-wasm

builds:
  - id: agentsquare
    main: ./cmd/agentsquare
    binary: agentsquare
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    files:
      - LICENSE
      - THIRD-PARTY-NOTICES
      - README.md
      - spec/**/*
      - web/viewer/**/*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
